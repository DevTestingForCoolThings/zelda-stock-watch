name: Zelda 40th stock watch

on:
  schedule:
    # Every 5 minutes, offset off the hour boundary (:02, :07, :12...).
    # In practice GitHub ran this only every 2-4 hours on this repo (14 runs
    # in 46h, Sept 2026), so treat the schedule as a backstop and trigger
    # runs externally if restocks need to be caught quickly. See README.
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
    inputs:
      self_test:
        description: "Self-test: check Nintendo items known to be in stock and send a real test alert"
        type: boolean
        default: false
      dry_run:
        description: "Check everything but send no notifications"
        type: boolean
        default: false
      diagnose:
        description: "Probe every HTML source with all fetch strategies and report"
        type: boolean
        default: false

# Never let two checks run at once and fight over state.json.
concurrency:
  group: zelda-watch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Self-test (known in-stock item, real notification)
        # Runs the real Nintendo checker against items that are in stock right
        # now and sends the result through the real alert path. Fails the job
        # if no in-stock item is detected. Touches no state.
        if: ${{ inputs.self_test }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOPICS: ${{ secrets.NTFY_TOPICS }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python3 zelda_watch.py --self-test

      - name: Fetch diagnostics
        if: ${{ inputs.diagnose }}
        run: python3 zelda_watch.py --diagnose

      - name: Commit diagnostics
        # Actions logs need auth to read, so publish the result into the repo.
        if: ${{ inputs.diagnose }}
        run: |
          git config user.name  "zelda-watch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f diagnostics.txt
          git commit -m "Fetch diagnostics from CI [skip ci]" || echo "nothing to commit"
          git pull --rebase --autostash && git push

      - name: Run stock check
        if: ${{ !inputs.diagnose && !inputs.self_test }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOPICS: ${{ secrets.NTFY_TOPICS }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: python3 zelda_watch.py

      - name: Save state
        # state.json only changes when something meaningful changed, so this
        # commits on real transitions rather than once every five minutes.
        if: ${{ !inputs.diagnose && !inputs.self_test }}
        run: |
          if [[ -n "$(git status --porcelain state.json)" ]]; then
            git config user.name  "zelda-watch-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "Update stock state [skip ci]"
            # Another run may have pushed while we were checking.
            for i in 1 2 3; do
              git pull --rebase --autostash && git push && exit 0
              sleep 5
            done
            echo "Could not push state after 3 attempts" >&2
            exit 1
          else
            echo "No state change."
          fi
